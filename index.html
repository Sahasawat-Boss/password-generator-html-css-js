<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Random Password Generator</title>
</head>

<body>
    <div class="container">
        <h1>Generate a <br><span>Random Password</span></h1>
        <div class="display">
            <input type="text" id="password" placeholder="password">
            <img onclick="copyPassword()" src="images/copy.png" alt="copy button">
        </div>
        <button onclick="createPassword()"><img src="images/generate.png" alt="generate image button">Generate
            Password
        </button>

        <div>
            <h2 for="input">Test Paste Password</h2>
            <input type="text" class="paste-password" placeholder="paste password here!">
        </div>
    </div>

    <script>
        const passwordBox = document.getElementById('password');
        const lenght = 14;

        const upperCase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lowerCase = "abcdefghijklmnopqrstuvwxyz";
        const number = '123456789';
        const symbol = "!@#$%^&*()_+=-/*";

        const allChars = upperCase + lowerCase + number + symbol;

        function createPassword() {
            let password = "";
            password += upperCase[Math.floor(Math.random() * upperCase.length)];
            password += lowerCase[Math.floor(Math.random() * lowerCase.length)];
            password += number[Math.floor(Math.random() * number.length)];
            password += symbol[Math.floor(Math.random() * symbol.length)];

            while (lenght > password.length) {
                password += allChars[Math.floor(Math.random() * allChars.length)]
            }
            passwordBox.value = password;
        }

        function copyPassword() {
            passwordBox.select()
            document.execCommand("copy")
        }

    </script>
</body>

</html>
